<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sự thức giác của Tiny - 20/10</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 400px;
            width: 85%;
            z-index: 10;
            position: relative;
        }

        h1 {
            color: #d63384;
            font-size: 22px;
            margin-bottom: 15px;
        }

        p {
            color: #444;
            font-size: 16px;
            line-height: 1.6;
            min-height: 60px;
        }

        .btn-play {
            background: #d63384;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(214, 51, 132, 0.4);
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .btn-play:hover {
            transform: scale(1.05);
            background: #e83e8c;
        }

        .heart {
            position: absolute;
            color: #ff4d6d;
            font-size: 20px;
            animation: float 4s linear infinite;
            opacity: 0;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Nhạc nền -->
    <audio id="bgMusic" loop>
        <source src="https://files.catbox.moe/5m9p12.mp3" type="audio/mpeg">
    </audio>

    <div class="card">
        <h1>🌸 Sự thức giấc của Tiny 🌸</h1>
        <p id="typewriter">Bấm nút bên dưới để mở quà nhé! ✨</p>
        <button class="btn-play" onclick="startSurprise()">Mở Quà & Bật Nhạc 🎶</button>
    </div>

    <script>
        const message = "Chúc bạn một ngày 20/10 thật xinh đẹp, luôn vui vẻ, may mắn và hạnh phúc bên những người thân yêu nhé! 💖✨";
        let index = 0;

        function typeWriter() {
            if (index < message.length) {
                document.getElementById("typewriter").innerHTML += message.charAt(index);
                index++;
                setTimeout(typeWriter, 50);
            }
        }

        function startSurprise() {
            const music = document.getElementById("bgMusic");
            music.play();

            document.getElementById("typewriter").innerHTML = "";
            typeWriter();

            setInterval(createHeart, 300);
        }

        function createHeart() {
            const heart = document.createElement("div");
            heart.classList.add("heart");
            heart.innerHTML = "💖";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = Math.random() * 2 + 3 + "s";
            document.body.appendChild(heart);

            setTimeout(() => { heart.remove(); }, 5000);
        }
    </script>
</body>
</html>
